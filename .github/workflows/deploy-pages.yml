name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json → packageManager
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This repo owns the custom domain (https://321.market), so the site is
      # built at the domain root: no NEXT_PUBLIC_BASE_PATH. Every asset path is
      # a plain `/assets/...` and Next.js rewrites `_next/*` itself.
      - name: Build static export
        run: pnpm build

      - name: Prepare Pages artifact
        run: |
          # .nojekyll stops Jekyll from dropping _next/ (leading underscore)
          touch out/.nojekyll
          ls out | head -20

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
